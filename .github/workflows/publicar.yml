name: Verificar fila e publicar Reels — Instagram e Facebook

on:
  schedule:
    # Prioridade do Reel matinal no horário exato; Stories são verificados às 09:10.
    - cron: "0 12 * * *"
    # Verifica a fila a cada 10 minutos, fora do minuto 0 (mais congestionado no
    # GitHub Actions). O publicador ignora itens futuros e recupera todos os itens
    # vencidos em ordem cronológica, até o limite de segurança por execução.
    - cron: "7,17,27,37,47,57 0-5,7-11,13-23 * * *"
    # Às 09h BRT, uma segunda tentativa curta às 09:07 recupera eventual atraso;
    # depois disso a janela fica livre para o pacote diário de Stories.
    - cron: "7 12 * * *"
    # Mantém livre a janela 03:15–03:50 BRT para o escritor local das filas.
    - cron: "7,57 6 * * *"
  workflow_dispatch:
    inputs:
      data_publicacao:
        description: "Data do Reel (AAAA-MM-DD); vazio usa hoje"
        required: false
        type: string
      permitir_data_futura:
        description: "Deixa o disparo manual usar uma data futura (queima aquele dia)"
        required: false
        default: "NAO"
        type: choice
        options:
          - "NAO"
          - "SIM"
      horario_publicacao:
        description: "Horário do Reel (05:00, 09:00, 13:00, 17:00 ou 21:00); vazio usa horário atual de Brasília"
        required: false
        type: string

concurrency:
  # Grupo próprio mantém somente o Reel mais recente pendente. O lock Git CAS
  # continua serializando este workflow, Stories e os escritores do PC.
  group: publicacao-instagram-facebook-reels
  cancel-in-progress: false

jobs:
  publicar:
    name: Verificar fila, publicar e comprovar o resultado
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Recusar data futura em disparo manual
        # Um teste manual apontado para amanha publica o conteudo HOJE e ainda
        # marca aquele dia como feito. No dia certo nada sai e o canal fica mudo
        # sem ninguem perceber. Foi o que calou a Mente Decifrada em 12 e
        # 13/09/2026, depois dos testes de 11/09. Por padrao o disparo manual so
        # mexe no dia de hoje; para furar isso e preciso dizer SIM na mao.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          DATA_PEDIDA: ${{ inputs.data_publicacao }}
          PERMITIR_FUTURO: ${{ inputs.permitir_data_futura }}
        run: |
          hoje="$(TZ=America/Sao_Paulo date +%F)"
          if [ -n "$DATA_PEDIDA" ] && [ "$DATA_PEDIDA" \> "$hoje" ] && [ "$PERMITIR_FUTURO" != "SIM" ]; then
            echo "Recusado: $DATA_PEDIDA e uma data futura; hoje e $hoje." >&2
            echo "Publicar um slot futuro agora deixa aquele dia mudo." >&2
            echo "Se for mesmo o que voce quer, marque permitir_data_futura=SIM." >&2
            exit 1
          fi
      # Uma execução pode ficar aguardando a anterior por causa do `concurrency`.
      # Nesse intervalo, a execução anterior atualiza a fila em `main`. Fazer o
      # checkout explícito da branch evita processar novamente o SHA antigo que
      # disparou a execução enfileirada.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validar publicador
        run: python -m unittest discover -s tests
      - name: Adquirir lock remoto das filas IG/FB
        id: lock_remoto
        env:
          DONO_LOCK: github-reels-${{ github.run_id }}-${{ github.run_attempt }}
        run: python lock_publicacao.py adquirir --repositorio . --dono "$DONO_LOCK" --arquivo-token "$RUNNER_TEMP/lock-publicacao.txt" --timeout 1800
      - name: Atualizar main depois de obter o lock
        run: |
          git fetch origin main
          git merge --ff-only origin/main
      - name: Processar Reels devidos
        id: publicacao
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MEDIA_CACHE_DIR: ${{ runner.temp }}/midias
          DATA_PUBLICACAO: ${{ inputs.data_publicacao }}
          HORARIO_PUBLICACAO: ${{ inputs.horario_publicacao }}
          MAX_ITENS_POR_EXECUCAO: "10"
        run: python publicar.py
      - name: Salvar resultado
        id: persistencia
        if: ${{ always() && (steps.publicacao.outcome == 'success' || steps.publicacao.outcome == 'failure') }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add fila/fila-reels.json
          git diff --staged --quiet || git commit -m "chore: atualizar reels $(date +%F)"
          python push_confirmado.py --repositorio .
      - name: Remover mídia temporária já publicada
        id: limpeza
        if: ${{ always() && steps.persistencia.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: fila-instagram-facebook
        run: python limpar_release.py --fila fila/fila-reels.json
      - name: Persistir marcadores da limpeza
        id: persistencia_limpeza
        if: ${{ always() && (steps.limpeza.outcome == 'success' || steps.limpeza.outcome == 'failure') }}
        run: |
          git add fila/fila-reels.json
          git diff --staged --quiet || git commit -m "chore: registrar limpeza de reels $(date +%F)"
          python push_confirmado.py --repositorio .
      - name: Registrar saúde operacional no Summary
        if: ${{ always() }}
        env:
          PROCESSAMENTO: ${{ steps.publicacao.outcome }}
          PERSISTENCIA: ${{ steps.persistencia.outcome }}
          LIMPEZA: ${{ steps.limpeza.outcome }}
          PERSISTENCIA_LIMPEZA: ${{ steps.persistencia_limpeza.outcome }}
        run: |
          {
            echo ""
            echo "### Saúde operacional do workflow"
            echo ""
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| Processamento da fila | \`${PROCESSAMENTO}\` |"
            echo "| Gravação da fila no GitHub | \`${PERSISTENCIA}\` |"
            echo "| Limpeza da mídia temporária | \`${LIMPEZA}\` |"
            echo "| Gravação do marcador de limpeza | \`${PERSISTENCIA_LIMPEZA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Resultado: PUBLICAÇÃO CONFIRMADA"
        if: ${{ always() && steps.publicacao.outputs.resultado == 'PUBLICADO' }}
        env:
          REELS_CONCLUIDOS: ${{ steps.publicacao.outputs.reels_concluidos }}
          INSTAGRAM_PUBLICADOS: ${{ steps.publicacao.outputs.instagram_publicados }}
          FACEBOOK_PUBLICADOS: ${{ steps.publicacao.outputs.facebook_publicados }}
        run: |
          echo "::notice title=PUBLICAÇÃO CONFIRMADA::${REELS_CONCLUIDOS} Reel(s) concluído(s); ${INSTAGRAM_PUBLICADOS} publicação(ões) no Instagram e ${FACEBOOK_PUBLICADOS} no Facebook. IDs no resumo da execução."
      - name: "Resultado: NENHUM REEL DEVIDO — NADA PUBLICADO"
        if: ${{ always() && steps.publicacao.outputs.resultado == 'NENHUM_REEL_DEVIDO' }}
        run: echo "::notice title=NENHUM REEL DEVIDO — NADA PUBLICADO::A verificação terminou normalmente, mas nenhuma publicação foi realizada."
      - name: "Resultado: FILA RECONCILIADA — NADA NOVO PUBLICADO"
        if: ${{ always() && steps.publicacao.outputs.resultado == 'RECONCILIADO_SEM_NOVA_PUBLICACAO' }}
        run: echo "::notice title=FILA RECONCILIADA — NADA NOVO PUBLICADO::Os itens devidos já tinham confirmação; nenhuma chamada nova de publicação foi concluída."
      - name: "Resultado: FALHA NA PUBLICAÇÃO"
        if: ${{ always() && steps.publicacao.outputs.resultado == 'FALHA' }}
        run: |
          echo "::error title=FALHA NA PUBLICAÇÃO::Consulte o resumo da execução para ver a rede e o erro."
          exit 1
      - name: "Resultado: INVÁLIDO OU AUSENTE — EXECUÇÃO INVÁLIDA"
        if: ${{ always() && steps.publicacao.outputs.resultado != 'PUBLICADO' && steps.publicacao.outputs.resultado != 'NENHUM_REEL_DEVIDO' && steps.publicacao.outputs.resultado != 'RECONCILIADO_SEM_NOVA_PUBLICACAO' && steps.publicacao.outputs.resultado != 'FALHA' }}
        run: |
          echo "::error title=RESULTADO INVÁLIDO OU AUSENTE::O publicador não informou um dos quatro estados reconhecidos."
          exit 1
      - name: "Resultado adicional: FALHA APÓS PROCESSAR A FILA"
        if: ${{ always() && steps.publicacao.outputs.resultado != 'FALHA' && (steps.persistencia.outcome == 'failure' || steps.limpeza.outcome == 'failure' || steps.persistencia_limpeza.outcome == 'failure') }}
        run: |
          echo "::error title=FALHA OPERACIONAL APÓS PROCESSAR::O resultado da Meta está no Summary, mas uma etapa posterior de limpeza ou gravação falhou."
          exit 1
      - name: Liberar lock remoto das filas IG/FB
        if: ${{ always() && steps.persistencia.outcome != 'failure' }}
        run: python lock_publicacao.py liberar --repositorio . --arquivo-token "$RUNNER_TEMP/lock-publicacao.txt"
